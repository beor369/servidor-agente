<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chat - Agente Clarita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            background-color: #f9f9f9;
            color: #1a1a1a;
        }
        h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 16px; }
        .chat-container {
            border: 1px solid #dde1e7;
            padding: 18px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        h3 { font-size: 1rem; font-weight: 500; color: #333; margin-bottom: 12px; }
        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            border: 1px solid #dde1e7;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #007BFF; }
        button {
            padding: 10px 18px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #444;
            line-height: 1.6;
        }
        #status p { margin: 6px 0; }
        #status strong { font-weight: 600; }
    </style>
</head>
<body>

    <h2>Prueba de Conexión a n8n</h2>
    
    <div id="g_id_onload"
         data-client_id="877226735670-ut216nfhr4jc20lc4iaslo4jg26tmimu.apps.googleusercontent.com" 
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <div id="chatInterface" class="chat-container">
        <h3 id="welcomeMessage">Hola!</h3>
        <input type="text" id="messageInput" placeholder="Escribe tu mensaje para el agente...">
        <button onclick="sendMessage()">Enviar a n8n</button>
        <div id="status"></div>
    </div>

    <script>
        // Variables globales para guardar los datos del usuario extraídos de Google
        let userEmail = "";
        let userName = "";

        // 1. Función para decodificar el token de Google y extraer correo/nombre
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 2. Función que se ejecuta cuando el usuario se loguea con éxito
        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            userEmail = data.email;
            userName = data.name;

            // Ocultar botón de Google y mostrar el chat
            document.querySelector('.g_id_signin').style.display = 'none';
            document.getElementById('chatInterface').style.display = 'block';
            document.getElementById('welcomeMessage').innerText = `Hola, ${userName} (${userEmail})`;
        }
// ---------------------------------------------------------
        // NUEVO: Escuchar la tecla "Enter" en la caja de texto
        // ---------------------------------------------------------
        const chatInput = document.getElementById('messageInput');
        
        chatInput.addEventListener('keypress', function (evento) {
            // Si la tecla que se presionó es el 'Enter'
            if (evento.key === 'Enter') {
                evento.preventDefault(); // Evita que el Enter haga saltos de línea raros
                sendMessage();           // Dispara el envío
            }
        });

        // 3. Función principal para armar el JSON y enviarlo al Webhook
       async function sendMessage() {
            const messageContent = document.getElementById('messageInput').value;
            const statusDiv = document.getElementById('status');
            
            // Crear un elemento para mostrar el mensaje del usuario
            statusDiv.innerHTML += `<p><strong>Tú:</strong> ${messageContent}</p>`;
            document.getElementById('messageInput').value = ""; // Limpiar input rápido

            if (!messageContent) return;

            // Construcción del Payload
// Nueva construcción del Payload (Estructurado)
            const payload = {
                instancia: {
                    nombre: "Web_Chat",
                    apikey: "none",
                    server_url: "web"
                },
                message: {
                    id: crypto.randomUUID(),
                    chat_id: userEmail,
                    username: userName,
                    content: messageContent,
                    content_type: "texto",
                    timestamp: new Date().toISOString()
                }
            };

            try {
                // 1. Enviamos y ESPERAMOS la respuesta (await)
                const response = await fetch("https://personal-n8n.85wqxz.easypanel.host/webhook-test/46c87db9-da2e-4c79-9f26-f77bd4d86be6", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

               if (response.ok) {
                    const data = await response.json();
                    
                    // Solo imprimimos si la respuesta viene del Agente de IA
                    if (data.output) {
                        statusDiv.innerHTML += `<p style="color: blue;"><strong>Clarita:</strong> ${data.output}</p>`;
                    }
                }
                
            } catch (error) {
                statusDiv.innerHTML += `<p style="color: red;">Error de red: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
